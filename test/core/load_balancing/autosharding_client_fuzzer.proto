syntax = "proto3";

package autosharding_client_fuzzer;

import "proto/autosharding/v1/autosharding.proto";
import "test/core/event_engine/fuzzing_event_engine/fuzzing_event_engine.proto";

// We'd ideally like to use google.rpc.Status instead of creating our
// own proto for this, but that winds up causing all sorts of dependency
// headaches.
message Status {
  int32 code = 1;
  string message = 2;
}

//
// interactions with AutoshardingClient API
//

message ResetBackoff {}

//
// interactions with fake transport
//

// Reads the next message sent by the client on the current stream, if any,
// and completes the send with the given result.
message ReadMessageFromClient {
  bool ok = 1;
}

message SendMessageToClient {
  // Use a oneof so that the fuzzer can send both well-formed responses and
  // arbitrary bytes.
  oneof payload {
    google.cloud.autosharding.v1.WatchShardingAssignmentResponse response = 1;
    bytes raw_bytes = 2;
  }
}

message SendStatusToClient {
  Status status = 1;
}

// Next free field: 5
message Action {
  oneof action_type {
    // interactions with AutoshardingClient API
    ResetBackoff reset_backoff = 1;
    // interactions with fake transport
    ReadMessageFromClient read_message_from_client = 2;
    SendMessageToClient send_message_to_client = 3;
    SendStatusToClient send_status_to_client = 4;
  }
}

message Msg {
  uint32 initial_assignment_timeout_ms = 1;
  repeated Action actions = 2;
  fuzzing_event_engine.Actions fuzzing_event_engine_actions = 3;
}
